<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Earthquake Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1e1e1e; padding: 15px 20px; text-align: center; border-bottom: 1px solid #333; }
    header h1 { font-size: 1.5rem; color: #ff4d4d; }
    #map { flex: 1; width: 100%; z-index: 1; }
    .info-panel { background: #1e1e1e; padding: 15px; border-top: 1px solid #333; max-height: 200px; overflow-y: auto; }
    .info-panel h2 { font-size: 1.1rem; margin-bottom: 10px; color: #ccc; }
    .earthquake-item { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .mag { font-weight: bold; font-size: 1.2rem; padding: 5px 10px; border-radius: 4px; background-color: #ff4d4d; color: white; }
    .details { flex: 1; margin-left: 12px; }
    .details .location { font-size: 0.95rem; font-weight: 600; }
    .details .time { font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>

  <header>
    <h1>Global Earthquake Monitor</h1>
  </header>

  <div id="map"></div>

  <div class="info-panel">
    <h2>Recent Earthquakes Worldwide</h2>
    <div id="earthquake-list">Loading real-time data...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    async function fetchGlobalEarthquakes() {
      try {
        const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson');
        const data = await response.json();
        
        const listContainer = document.getElementById('earthquake-list');
        listContainer.innerHTML = '';

        data.features.forEach(quake => {
          const mag = quake.properties.mag;
          const place = quake.properties.place;
          const time = new Date(quake.properties.time).toLocaleTimeString();
          const coords = quake.geometry.coordinates;

          // Add marker to map
          L.circleMarker([coords[1], coords[0]], {
            radius: mag * 3,
            fillColor: mag > 5 ? '#ff0000' : '#ff9900',
            color: '#000',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          }).addTo(map).bindPopup(`<b>${place}</b><br>Magnitude: ${mag}<br>Time: ${time}`);

          // Add to recent list
          const item = document.createElement('div');
          item.className = 'earthquake-item';
          item.innerHTML = `
            <div class="mag">${mag ? mag.toFixed(1) : 'N/A'}</div>
            <div class="details">
              <div class="location">${place}</div>
              <div class="time">${time}</div>
            </div>
          `;
          listContainer.appendChild(item);
        });
      } catch (error) {
        document.getElementById('earthquake-list').innerHTML = 'Failed to load live data.';
      }
    }

    fetchGlobalEarthquakes();
    setInterval(fetchGlobalEarthquakes, 60000); // Auto-update
  </script>
</body>
  </html>
